basePath: /
definitions:
  models.User:
    properties:
      age:
        example: 30
        maximum: 120
        minimum: 0
        type: integer
      created_at:
        format: date-time
        type: string
      email:
        example: john.doe@example.com
        format: email
        type: string
      id:
        type: string
      name:
        example: John Doe
        maxLength: 20
        minLength: 3
        type: string
      password:
        example: password123
        type: string
    required:
    - name
    - email
    - password
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is a sample server for users.
  title: Example User API
  version: "1.0"
paths:
  /user/{name}:
    get:
      description: Returns a simple greeting message.
      parameters:
      - description: User name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Greet user by name
      tags:
      - Users
  /users:
    post:
      consumes:
      - application/json
      description: Create a user with name, email, and age
      parameters:
      - description: User data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Email already registered
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new user
      tags:
      - Users
swagger: "2.0"
